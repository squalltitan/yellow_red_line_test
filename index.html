<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>治理線與用地範圍線 AR 現地展示</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- A-Frame：先用穩定版本 -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>

  <!-- AR.js：固定版本，避免 master 版不穩 -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <style>
    html, body {
      margin: 0;
      overflow: hidden;
      font-family: "Microsoft JhengHei", Arial, sans-serif;
      background: #000;
    }

    #infoPanel {
      position: fixed;
      left: 10px;
      right: 10px;
      bottom: 12px;
      z-index: 9999;
      background: rgba(255, 255, 255, 0.93);
      border-radius: 14px;
      padding: 10px 12px;
      font-size: 14px;
      line-height: 1.55;
      box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    }

    .title {
      font-weight: bold;
      font-size: 15px;
      margin-bottom: 4px;
    }

    .yellow {
      color: #b08a00;
      font-weight: bold;
    }

    .red {
      color: #d00000;
      font-weight: bold;
    }

    .blue {
      color: #0057ff;
      font-weight: bold;
    }

    .note {
      font-size: 12px;
      color: #555;
      margin-top: 4px;
    }

    button {
      margin-top: 6px;
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 10px;
      background: #1f6feb;
      color: white;
      font-weight: bold;
      font-size: 14px;
    }

    .test-btn {
      background: #d00000;
    }

    .front-btn {
      background: #0057ff;
    }

    .small {
      font-size: 12px;
      color: #444;
    }
  </style>
</head>

<body>

  <div id="infoPanel">
    <div class="title">河川治理線與用地範圍線 AR 現地展示</div>

    <div><span class="yellow">黃線</span>：河川治理線</div>
    <div><span class="red">紅線</span>：用地範圍線</div>

    <div>目前定位精度：<span id="accuracy">等待定位中</span></div>
    <div>目前座標：<span id="currentPosition">等待定位中</span></div>
    <div>載入狀態：<span id="status">準備載入圖資</span></div>
    <div class="small">除錯訊息：<span id="debugText">尚無</span></div>

    <button class="front-btn" onclick="addFrontBlueBall()">建立畫面前方藍球</button>
    <button class="test-btn" onclick="addGpsRedBallNearMe()">建立 GPS 測試紅球</button>
    <button onclick="reloadLines()">重新載入紅黃線</button>
    <button onclick="clearOldEntities()">清除畫面物件</button>

    <div class="note">
      測試順序：先按「畫面前方藍球」。若藍球看得到，代表 3D 顯示正常；再測 GPS 紅球與紅黃線。<br>
      本畫面僅供現地輔助展示，實際位置仍應以核定圖說及測量成果為準。
    </div>
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="antialias: true; alpha: true"
    arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;"
  >
    <!-- 使用舊版較穩的 gps-camera，不用 gps-new-camera -->
    <a-camera gps-camera rotation-reader></a-camera>
  </a-scene>

  <script>
    const scene = document.querySelector("a-scene");

    const MAX_POINTS_PER_LAYER = 300;

    let yellowPointCount = 0;
    let redPointCount = 0;

    let lastLat = null;
    let lastLng = null;
    let lastAccuracy = null;

    window.addEventListener("error", function(e) {
      setDebug("錯誤：" + e.message);
    });

    function setStatus(text) {
      document.getElementById("status").textContent = text;
    }

    function setDebug(text) {
      document.getElementById("debugText").textContent = text;
      console.log(text);
    }

    navigator.geolocation.watchPosition(
      pos => {
        lastLat = pos.coords.latitude;
        lastLng = pos.coords.longitude;
        lastAccuracy = pos.coords.accuracy;

        document.getElementById("accuracy").textContent =
          "約 ±" + lastAccuracy.toFixed(1) + " 公尺";

        document.getElementById("currentPosition").textContent =
          lastLat.toFixed(6) + ", " + lastLng.toFixed(6);
      },
      err => {
        document.getElementById("accuracy").textContent = "無法取得定位";
        document.getElementById("currentPosition").textContent = "無法取得定位";
        setDebug("定位失敗：" + err.message);
      },
      {
        enableHighAccuracy: true,
        maximumAge: 0,
        timeout: 15000
      }
    );

    function clearOldEntities() {
      const oldEntities = document.querySelectorAll(".line-point, .test-ball, .front-ball");
      oldEntities.forEach(el => el.remove());
      setDebug("已清除畫面物件");
    }

    function addFrontBlueBall() {
      const entity = document.createElement("a-entity");
      entity.classList.add("front-ball");

      entity.setAttribute("geometry", {
        primitive: "sphere",
        radius: 0.6
      });

      entity.setAttribute("material", {
        color: "#0057ff",
        opacity: 1
      });

      // 不靠 GPS，固定在攝影機前方 4 公尺
      entity.setAttribute("position", "0 0 -4");

      const text = document.createElement("a-text");
      text.setAttribute("value", "前方藍球");
      text.setAttribute("color", "#0057ff");
      text.setAttribute("align", "center");
      text.setAttribute("scale", "1.5 1.5 1.5");
      text.setAttribute("position", "0 1.1 0");
      entity.appendChild(text);

      scene.appendChild(entity);

      setStatus("已建立畫面前方藍球");
      setDebug("若藍球看得到，代表 A-Frame 3D 顯示正常");
    }

    function addGpsRedBallNearMe() {
      if (lastLat === null || lastLng === null) {
        alert("目前尚未取得定位，請稍候再試。");
        return;
      }

      // 北方約 8 公尺
      const testLat = lastLat + 0.000072;
      const testLng = lastLng;

      const entity = document.createElement("a-entity");
      entity.classList.add("test-ball");

      // 使用舊版 gps-entity-place
      entity.setAttribute(
        "gps-entity-place",
        "latitude: " + testLat + "; longitude: " + testLng + ";"
      );

      entity.setAttribute("geometry", {
        primitive: "sphere",
        radius: 3
      });

      entity.setAttribute("material", {
        color: "#ff0000",
        opacity: 1
      });

      entity.setAttribute("scale", "3 3 3");

      const text = document.createElement("a-text");
      text.setAttribute("value", "GPS測試紅球");
      text.setAttribute("color", "#ff0000");
      text.setAttribute("align", "center");
      text.setAttribute("scale", "10 10 10");
      text.setAttribute("position", "0 8 0");
      entity.appendChild(text);

      scene.appendChild(entity);

      setStatus("已建立 GPS 測試紅球");
      setDebug("GPS 紅球座標：" + testLat.toFixed(6) + ", " + testLng.toFixed(6) + "；請朝北方或原地慢慢轉一圈");
    }

    async function reloadLines() {
      setStatus("載入中...");
      setDebug("開始讀取 GeoJSON");

      clearOldEntities();

      yellowPointCount = 0;
      redPointCount = 0;

      try {
        await loadGeoJsonAsARPoints("yellow_line.geojson", "yellow");
        await loadGeoJsonAsARPoints("red_line.geojson", "red");

        setStatus("圖資載入完成：黃線 " + yellowPointCount + " 點，紅線 " + redPointCount + " 點");
        setDebug("已建立紅黃線 AR 點位。若看不到，請確認目前位置是否靠近你在 QGIS 畫的線。");
      } catch (e) {
        console.error(e);
        setStatus("圖資載入失敗");
        setDebug("請檢查 GeoJSON 檔名、路徑或格式：" + e.message);
      }
    }

    async function loadGeoJsonAsARPoints(url, colorType) {
      const response = await fetch(url);

      if (!response.ok) {
        throw new Error("無法讀取檔案：" + url);
      }

      const geojson = await response.json();
      const coords = extractCoordinatesFromGeoJson(geojson);
      const sampled = sampleCoordinates(coords, MAX_POINTS_PER_LAYER);

      if (colorType === "yellow") {
        yellowPointCount = sampled.length;
      } else {
        redPointCount = sampled.length;
      }

      sampled.forEach((coord, index) => {
        const lng = Number(coord[0]);
        const lat = Number(coord[1]);

        if (!isValidLngLat(lng, lat)) {
          console.warn("疑似非 WGS84 經緯度座標，已略過：", coord);
          return;
        }

        addARPoint(lat, lng, colorType, index);
      });
    }

    function extractCoordinatesFromGeoJson(geojson) {
      let result = [];

      if (!geojson || !geojson.features) {
        return result;
      }

      geojson.features.forEach(feature => {
        const geom = feature.geometry;
        if (!geom) return;

        if (geom.type === "LineString") {
          result = result.concat(geom.coordinates);
        }

        if (geom.type === "MultiLineString") {
          geom.coordinates.forEach(line => {
            result = result.concat(line);
          });
        }

        if (geom.type === "GeometryCollection") {
          geom.geometries.forEach(g => {
            if (g.type === "LineString") {
              result = result.concat(g.coordinates);
            }
            if (g.type === "MultiLineString") {
              g.coordinates.forEach(line => {
                result = result.concat(line);
              });
            }
          });
        }
      });

      return result;
    }

    function sampleCoordinates(coords, maxCount) {
      if (coords.length <= maxCount) return coords;

      const sampled = [];
      const step = Math.ceil(coords.length / maxCount);

      for (let i = 0; i < coords.length; i += step) {
        sampled.push(coords[i]);
      }

      return sampled;
    }

    function isValidLngLat(lng, lat) {
      return (
        typeof lng === "number" &&
        typeof lat === "number" &&
        !isNaN(lng) &&
        !isNaN(lat) &&
        lng >= -180 &&
        lng <= 180 &&
        lat >= -90 &&
        lat <= 90
      );
    }

    function addARPoint(lat, lng, colorType, index) {
      const entity = document.createElement("a-entity");
      entity.classList.add("line-point");

      const color = colorType === "yellow" ? "#FFD400" : "#E60000";
      const label = colorType === "yellow" ? "治理線" : "用地線";

      entity.setAttribute(
        "gps-entity-place",
        "latitude: " + lat + "; longitude: " + lng + ";"
      );

      entity.setAttribute("geometry", {
        primitive: "sphere",
        radius: 2
      });

      entity.setAttribute("material", {
        color: color,
        opacity: 1
      });

      entity.setAttribute("scale", "2.5 2.5 2.5");

      if (index % 10 === 0) {
        const text = document.createElement("a-text");
        text.setAttribute("value", label);
        text.setAttribute("color", color);
        text.setAttribute("align", "center");
        text.setAttribute("scale", "8 8 8");
        text.setAttribute("position", "0 6 0");
        entity.appendChild(text);
      }

      scene.appendChild(entity);
    }

    window.addEventListener("load", () => {
      setDebug("頁面已載入，請先按「建立畫面前方藍球」測試 3D 顯示");
    });
  </script>
</body>
</html>
