<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>治理線與用地範圍線 AR 現地展示</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>

  <!-- AR.js -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    html, body {
      margin: 0;
      overflow: hidden;
      font-family: "Microsoft JhengHei", Arial, sans-serif;
    }

    #infoPanel {
      position: fixed;
      left: 10px;
      right: 10px;
      bottom: 12px;
      z-index: 9999;
      background: rgba(255, 255, 255, 0.92);
      border-radius: 14px;
      padding: 10px 12px;
      font-size: 14px;
      line-height: 1.6;
      box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    }

    .title {
      font-weight: bold;
      font-size: 15px;
      margin-bottom: 4px;
    }

    .yellow {
      color: #b08a00;
      font-weight: bold;
    }

    .red {
      color: #d00000;
      font-weight: bold;
    }

    .note {
      font-size: 12px;
      color: #555;
      margin-top: 4px;
    }

    button {
      margin-top: 6px;
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 10px;
      background: #1f6feb;
      color: white;
      font-weight: bold;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div id="infoPanel">
    <div class="title">河川治理線與用地範圍線 AR 現地展示</div>
    <div><span class="yellow">黃線</span>：河川治理線</div>
    <div><span class="red">紅線</span>：用地範圍線</div>
    <div>目前定位精度：<span id="accuracy">等待定位中</span></div>
    <div>載入狀態：<span id="status">準備載入圖資</span></div>
    <button onclick="reloadLines()">重新載入線位</button>
    <div class="note">
      本畫面僅供現地輔助展示，實際位置仍應以核定圖說及測量成果為準。
    </div>
  </div>

  <a-scene
    vr-mode-ui="enabled: false"
    embedded
    renderer="antialias: true; alpha: true"
    arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;"
  >
    <a-camera gps-new-camera="gpsMinDistance: 1"></a-camera>
  </a-scene>

  <script>
    const scene = document.querySelector("a-scene");

    const MAX_POINTS_PER_LAYER = 300; 
    // 第一版先限制點數，避免手機太卡。
    // 如果線很長，請只放現場附近範圍的資料。

    window.addEventListener("gps-camera-update-position", function(event) {
      const accuracyText = event.detail && event.detail.position
        ? "定位中"
        : "定位中";

      // 有些瀏覽器不一定會在這裡提供 accuracy，
      // 所以另外用 geolocation 補抓。
    });

    navigator.geolocation.watchPosition(
      pos => {
        const acc = pos.coords.accuracy;
        document.getElementById("accuracy").textContent =
          "約 ±" + acc.toFixed(1) + " 公尺";
      },
      err => {
        document.getElementById("accuracy").textContent =
          "無法取得定位";
      },
      {
        enableHighAccuracy: true,
        maximumAge: 0,
        timeout: 15000
      }
    );

    async function reloadLines() {
      document.getElementById("status").textContent = "載入中...";

      clearOldEntities();

      try {
        await loadGeoJsonAsARPoints("yellow_line.geojson", "yellow");
        await loadGeoJsonAsARPoints("red_line.geojson", "red");

        document.getElementById("status").textContent = "圖資載入完成";
      } catch (e) {
        console.error(e);
        document.getElementById("status").textContent = "圖資載入失敗，請檢查 GeoJSON";
      }
    }

    function clearOldEntities() {
      const oldEntities = document.querySelectorAll(".line-point");
      oldEntities.forEach(el => el.remove());
    }

    async function loadGeoJsonAsARPoints(url, colorType) {
      const response = await fetch(url);
      const geojson = await response.json();

      const coords = extractCoordinatesFromGeoJson(geojson);
      const sampled = sampleCoordinates(coords, MAX_POINTS_PER_LAYER);

      sampled.forEach((coord, index) => {
        const lng = coord[0];
        const lat = coord[1];

        addARPoint(lat, lng, colorType, index);
      });
    }

    function extractCoordinatesFromGeoJson(geojson) {
      let result = [];

      if (!geojson || !geojson.features) {
        return result;
      }

      geojson.features.forEach(feature => {
        const geom = feature.geometry;
        if (!geom) return;

        if (geom.type === "LineString") {
          result = result.concat(geom.coordinates);
        }

        if (geom.type === "MultiLineString") {
          geom.coordinates.forEach(line => {
            result = result.concat(line);
          });
        }
      });

      return result;
    }

    function sampleCoordinates(coords, maxCount) {
      if (coords.length <= maxCount) return coords;

      const sampled = [];
      const step = Math.ceil(coords.length / maxCount);

      for (let i = 0; i < coords.length; i += step) {
        sampled.push(coords[i]);
      }

      return sampled;
    }

    function addARPoint(lat, lng, colorType, index) {
      const entity = document.createElement("a-entity");
      entity.classList.add("line-point");

      const color = colorType === "yellow" ? "#FFD400" : "#E60000";
      const label = colorType === "yellow" ? "治理線" : "用地線";

      entity.setAttribute(
        "gps-new-entity-place",
        `latitude: ${lat}; longitude: ${lng};`
      );

      // 用小圓柱作為線位點
      entity.setAttribute("geometry", {
        primitive: "cylinder",
        radius: 1.2,
        height: 0.25
      });

      entity.setAttribute("material", {
        color: color,
        opacity: 0.95
      });

      entity.setAttribute("scale", "4 4 4");

      // 讓它稍微浮起來，避免被地面遮住
      entity.setAttribute("position", "0 1.5 0");

      // 每隔幾個點加文字標籤，避免畫面太亂
      if (index % 20 === 0) {
        const text = document.createElement("a-text");
        text.setAttribute("value", label);
        text.setAttribute("color", color);
        text.setAttribute("align", "center");
        text.setAttribute("scale", "12 12 12");
        text.setAttribute("position", "0 4 0");
        text.setAttribute("look-at", "[gps-new-camera]");
        entity.appendChild(text);
      }

      scene.appendChild(entity);
    }

    window.addEventListener("load", () => {
      reloadLines();
    });
  </script>
</body>
</html>
