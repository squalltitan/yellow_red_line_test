<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>治理線與用地範圍線 AR 現地展示</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>

  <!-- AR.js -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    html, body {
      margin: 0;
      overflow: hidden;
      font-family: "Microsoft JhengHei", Arial, sans-serif;
      background: #000;
    }

    #infoPanel {
      position: fixed;
      left: 10px;
      right: 10px;
      bottom: 12px;
      z-index: 9999;
      background: rgba(255, 255, 255, 0.92);
      border-radius: 14px;
      padding: 10px 12px;
      font-size: 14px;
      line-height: 1.6;
      box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    }

    .title {
      font-weight: bold;
      font-size: 15px;
      margin-bottom: 4px;
    }

    .yellow {
      color: #b08a00;
      font-weight: bold;
    }

    .red {
      color: #d00000;
      font-weight: bold;
    }

    .note {
      font-size: 12px;
      color: #555;
      margin-top: 4px;
    }

    button {
      margin-top: 6px;
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 10px;
      background: #1f6feb;
      color: white;
      font-weight: bold;
      font-size: 14px;
    }

    .test-btn {
      background: #d00000;
    }
  </style>
</head>

<body>

  <div id="infoPanel">
    <div class="title">河川治理線與用地範圍線 AR 現地展示</div>

    <div><span class="yellow">黃線</span>：河川治理線</div>
    <div><span class="red">紅線</span>：用地範圍線</div>

    <div>目前定位精度：<span id="accuracy">等待定位中</span></div>
    <div>目前座標：<span id="currentPosition">等待定位中</span></div>
    <div>載入狀態：<span id="status">準備載入圖資</span></div>

    <button onclick="reloadLines()">重新載入線位</button>
    <button class="test-btn" onclick="addTestBallNearMe()">建立測試紅球</button>

    <div class="note">
      本畫面僅供現地輔助展示，實際位置仍應以核定圖說及測量成果為準。<br>
      測試時請先到戶外空曠處，並等定位精度降低後再查看。
    </div>
  </div>

  <a-scene
    vr-mode-ui="enabled: false"
    embedded
    renderer="antialias: true; alpha: true"
    arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;"
  >
    <a-camera gps-new-camera="gpsMinDistance: 1"></a-camera>
  </a-scene>

  <script>
    const scene = document.querySelector("a-scene");

    // 每個圖層最多顯示幾個點。
    // 測試階段先不要太多，避免手機太卡。
    const MAX_POINTS_PER_LAYER = 300;

    let yellowPointCount = 0;
    let redPointCount = 0;

    let lastLat = null;
    let lastLng = null;
    let lastAccuracy = null;

    // 持續取得手機定位精度
    navigator.geolocation.watchPosition(
      pos => {
        lastLat = pos.coords.latitude;
        lastLng = pos.coords.longitude;
        lastAccuracy = pos.coords.accuracy;

        document.getElementById("accuracy").textContent =
          "約 ±" + lastAccuracy.toFixed(1) + " 公尺";

        document.getElementById("currentPosition").textContent =
          lastLat.toFixed(6) + ", " + lastLng.toFixed(6);
      },
      err => {
        document.getElementById("accuracy").textContent =
          "無法取得定位";

        document.getElementById("currentPosition").textContent =
          "無法取得定位";

        console.error("定位失敗：", err);
      },
      {
        enableHighAccuracy: true,
        maximumAge: 0,
        timeout: 15000
      }
    );

    async function reloadLines() {
      document.getElementById("status").textContent = "載入中...";

      clearOldEntities();

      yellowPointCount = 0;
      redPointCount = 0;

      try {
        await loadGeoJsonAsARPoints("yellow_line.geojson", "yellow");
        await loadGeoJsonAsARPoints("red_line.geojson", "red");

        document.getElementById("status").textContent =
          "圖資載入完成：黃線 " + yellowPointCount + " 點，紅線 " + redPointCount + " 點";
      } catch (e) {
        console.error("圖資載入失敗：", e);

        document.getElementById("status").textContent =
          "圖資載入失敗，請檢查 GeoJSON 檔名、路徑或格式";
      }
    }

    function clearOldEntities() {
      const oldEntities = document.querySelectorAll(".line-point, .test-ball");
      oldEntities.forEach(el => el.remove());
    }

    async function loadGeoJsonAsARPoints(url, colorType) {
      const response = await fetch(url);

      if (!response.ok) {
        throw new Error("無法讀取檔案：" + url);
      }

      const geojson = await response.json();

      const coords = extractCoordinatesFromGeoJson(geojson);
      const sampled = sampleCoordinates(coords, MAX_POINTS_PER_LAYER);

      if (colorType === "yellow") {
        yellowPointCount = sampled.length;
      } else {
        redPointCount = sampled.length;
      }

      sampled.forEach((coord, index) => {
        const lng = coord[0];
        const lat = coord[1];

        // 檢查座標是否像經緯度
        if (!isValidLngLat(lng, lat)) {
          console.warn("疑似非 WGS84 經緯度座標，已略過：", coord);
          return;
        }

        addARPoint(lat, lng, colorType, index);
      });
    }

    function extractCoordinatesFromGeoJson(geojson) {
      let result = [];

      if (!geojson || !geojson.features) {
        console.warn("GeoJSON 沒有 features");
        return result;
      }

      geojson.features.forEach(feature => {
        const geom = feature.geometry;
        if (!geom) return;

        if (geom.type === "LineString") {
          result = result.concat(geom.coordinates);
        }

        if (geom.type === "MultiLineString") {
          geom.coordinates.forEach(line => {
            result = result.concat(line);
          });
        }

        // 若你的 QGIS 匯出成 GeometryCollection，可先提醒
        if (geom.type !== "LineString" && geom.type !== "MultiLineString") {
          console.warn("目前程式未處理此幾何類型：", geom.type);
        }
      });

      return result;
    }

    function sampleCoordinates(coords, maxCount) {
      if (coords.length <= maxCount) return coords;

      const sampled = [];
      const step = Math.ceil(coords.length / maxCount);

      for (let i = 0; i < coords.length; i += step) {
        sampled.push(coords[i]);
      }

      return sampled;
    }

    function isValidLngLat(lng, lat) {
      return (
        typeof lng === "number" &&
        typeof lat === "number" &&
        lng >= -180 &&
        lng <= 180 &&
        lat >= -90 &&
        lat <= 90
      );
    }

    function addARPoint(lat, lng, colorType, index) {
      const entity = document.createElement("a-entity");
      entity.classList.add("line-point");

      const color = colorType === "yellow" ? "#FFD400" : "#E60000";
      const label = colorType === "yellow" ? "治理線" : "用地線";

      entity.setAttribute(
        "gps-new-entity-place",
        "latitude: " + lat + "; longitude: " + lng + ";"
      );

      // 測試階段改成大型球體，先求看得到
      entity.setAttribute("geometry", {
        primitive: "sphere",
        radius: 2
      });

      entity.setAttribute("material", {
        color: color,
        opacity: 1
      });

      // 放大一點
      entity.setAttribute("scale", "4 4 4");

      // 稍微浮起來，避免被地面或視角遮住
      entity.setAttribute("position", "0 2.5 0");

      // 每隔一段放文字標籤，避免畫面太亂
      if (index % 20 === 0) {
        const text = document.createElement("a-text");
        text.setAttribute("value", label);
        text.setAttribute("color", color);
        text.setAttribute("align", "center");
        text.setAttribute("scale", "12 12 12");
        text.setAttribute("position", "0 5 0");
        text.setAttribute("look-at", "[gps-new-camera]");
        entity.appendChild(text);
      }

      scene.appendChild(entity);
    }

    function addTestBallNearMe() {
      if (lastLat === null || lastLng === null) {
        alert("目前尚未取得定位，請稍候再試。");
        return;
      }

      // 在目前位置北方約 8 公尺建立測試球
      // 緯度 0.000009 約等於 1 公尺，0.000072 約等於 8 公尺
      const testLat = lastLat + 0.000072;
      const testLng = lastLng;

      const entity = document.createElement("a-entity");
      entity.classList.add("test-ball");

      entity.setAttribute(
        "gps-new-entity-place",
        "latitude: " + testLat + "; longitude: " + testLng + ";"
      );

      entity.setAttribute("geometry", {
        primitive: "sphere",
        radius: 2.5
      });

      entity.setAttribute("material", {
        color: "#ff0000",
        opacity: 1
      });

      entity.setAttribute("scale", "5 5 5");
      entity.setAttribute("position", "0 3 0");

      const text = document.createElement("a-text");
      text.setAttribute("value", "測試紅球");
      text.setAttribute("color", "#ff0000");
      text.setAttribute("align", "center");
      text.setAttribute("scale", "14 14 14");
      text.setAttribute("position", "0 6 0");
      text.setAttribute("look-at", "[gps-new-camera]");
      entity.appendChild(text);

      scene.appendChild(entity);

      document.getElementById("status").textContent =
        "已建立測試紅球，請朝北方或原地慢慢轉一圈查看";
    }

    window.addEventListener("load", () => {
      reloadLines();
    });
  </script>
</body>
</html>
